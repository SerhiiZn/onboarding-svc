name: CI/CD Pipeline for Onboarding-svc

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Tests
        run: |
          pip install -r requirements.txt pytest
          pytest

      - name: Log in to OpenShift Cluster
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: https://console-openshift-console.apps.rm1.0a51.p1.openshiftapps.com
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          insecure_skip_tls_verify: true

      - name: Build and Push Image to OpenShift Registry
        uses: redhat-actions/buildah-build@v2
        with:
          image: onboarding-svc
          tags: latest
          dockerfiles: |
            ./Dockerfile

      - name: Deploy Helm Chart to OpenShift
        run: |
          helm upgrade --install onboarding-svc ./deploy/helm/onboarding-svc \
            --namespace serhiizn-dev \
            --set image.tag=latest
