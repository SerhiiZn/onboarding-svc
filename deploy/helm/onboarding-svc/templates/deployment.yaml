apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "onboarding-svc.fullname" . }}
  labels:
    {{- include "onboarding-svc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "onboarding-svc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "onboarding-svc.selectorLabels" . | nindent 8 }}
    spec:
      volumes:
        - name: shared-artifacts
          emptyDir: {}
      
      initContainers:
        - name: fetch-s3-artifacts
          image: amazon/aws-cli:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "==> Downloading meta_bundle.tar.gz from Filebase S3..."
              aws --endpoint-url https://s3.filebase.io --region us-east-1 s3 cp s3://testserhii/pipelines/latest/meta_bundle.tar.gz /tmp/meta_bundle.tar.gz
              
              echo "==> Extracting archive using Python..."
              python3 -c "import tarfile; tarfile.open('/tmp/meta_bundle.tar.gz').extractall('/app/shared-artifacts')"
              
              echo "==> Setting permissions for extracted files..."
              find /app/shared-artifacts -exec chmod g+rwX {} + || true
              
              echo "==> Artifacts successfully prepared:"
              ls -la /app/shared-artifacts
          envFrom:
            - secretRef:
                name: filebase-s3-credentials
          volumeMounts:
            - name: shared-artifacts
              mountPath: /app/shared-artifacts

      containers:
        - name: {{ .Chart.Name }}
          image: "image-registry.openshift-image-registry.svc:5000/{{ .Release.Namespace }}/{{ .Chart.Name }}:latest"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: shared-artifacts
              mountPath: /app/shared-artifacts
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
